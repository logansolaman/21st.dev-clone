<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marketing Dashboard - 1:1 Clone</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen flex items-center justify-center p-4 font-sans select-none">
  
  <!-- 1:1 Marketing Dashboard Card by @ravikatiyar162 -->
  <div class="w-full max-w-sm rounded-3xl bg-neutral-950 border border-neutral-800 p-6 shadow-2xl flex flex-col gap-5">
    
    <!-- Top Row: Icon & Filter Action -->
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-neutral-900 border border-neutral-800 flex items-center justify-center text-white">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
        </div>
        <div>
          <h3 class="text-sm font-bold text-white leading-tight">Time Tracking</h3>
          <p class="text-[11px] text-neutral-400">Activity Distribution</p>
        </div>
      </div>

      <button id="filter-btn" class="text-xs text-neutral-400 hover:text-white px-2.5 py-1 rounded-lg border border-neutral-800 hover:bg-neutral-900 transition-colors">
        This Week
      </button>
    </div>

    <!-- Total Metric -->
    <div class="flex items-baseline gap-2">
      <span class="text-3xl font-black tracking-tight text-white font-mono">16.5</span>
      <span class="text-xs text-neutral-500 font-medium">Total Tracked Hours</span>
    </div>

    <!-- Segmented Color Progress Bar -->
    <div class="w-full h-3 rounded-full bg-neutral-900 overflow-hidden flex gap-1 p-0.5 border border-neutral-800/80">
      <div class="h-full rounded-full bg-green-400" style="width: 45%;" title="Productive: 45%"></div>
      <div class="h-full rounded-full bg-lime-300" style="width: 25%;" title="Middle: 25%"></div>
      <div class="h-full rounded-full bg-yellow-300" style="width: 15%;" title="Break: 15%"></div>
      <div class="h-full rounded-full bg-slate-700" style="width: 15%;" title="Idle: 15%"></div>
    </div>

    <!-- Metric Breakdown List -->
    <div class="grid grid-cols-2 gap-3 pt-2">
      <div class="flex items-center gap-2 text-xs">
        <span class="w-2.5 h-2.5 rounded-full bg-green-400 shrink-0"></span>
        <span class="text-neutral-300 font-medium">Productive: <b class="text-white font-mono">45%</b></span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-2.5 h-2.5 rounded-full bg-lime-300 shrink-0"></span>
        <span class="text-neutral-300 font-medium">Middle: <b class="text-white font-mono">25%</b></span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-2.5 h-2.5 rounded-full bg-yellow-300 shrink-0"></span>
        <span class="text-neutral-300 font-medium">Break: <b class="text-white font-mono">15%</b></span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-2.5 h-2.5 rounded-full bg-slate-700 shrink-0"></span>
        <span class="text-neutral-300 font-medium">Idle: <b class="text-white font-mono">15%</b></span>
      </div>
    </div>

    <!-- Bottom Action CTA -->
    <button class="w-full py-2.5 rounded-xl bg-neutral-900 hover:bg-neutral-800 text-xs font-semibold text-white border border-neutral-800 transition-colors mt-1">
      View Detailed Analysis
    </button>

  </div>

  <script>
    document.getElementById("filter-btn").addEventListener("click", () => {
      alert("Filter clicked!");
    });
  </script>
</body>
</html>
