<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liquid Metal Button (Enhanced Shader Studio)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --font-display: "Space Grotesk", sans-serif;
      --font-mono: "JetBrains Mono", monospace;
    }
    body {
      font-family: "Plus Jakarta Sans", sans-serif;
      background-color: #070a12;
      background-image:
        radial-gradient(circle at 50% 20%, rgba(255, 255, 255, 0.05) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(56, 189, 248, 0.04) 0%, transparent 50%),
        linear-gradient(to bottom, transparent, rgba(2, 6, 23, 0.95));
    }
    .perspective-1000 {
      perspective: 1000px;
    }
    .preserve-3d {
      transform-style: preserve-3d;
    }
    .liquid-btn-core {
      transition: 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .liquid-btn-wrap:hover .layer-top {
      transform: translateZ(32px) scale(1.03);
    }
    .liquid-btn-wrap:hover .layer-plate {
      transform: translateZ(18px) scale(1.03);
      box-shadow: 0 12px 30px -5px rgba(0, 0, 0, 0.6);
    }
    .liquid-btn-wrap:hover .layer-base {
      transform: translateZ(6px) scale(1.03);
      box-shadow: 0 0 25px var(--halo-color, rgba(255, 255, 255, 0.2));
    }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col justify-between p-4 md:p-8 select-none">

  <!-- Top bar -->
  <header class="w-full max-w-6xl mx-auto flex items-center justify-between pb-4 border-b border-slate-800">
    <div class="flex items-center gap-2">
      <span class="px-2 py-0.5 rounded text-xs font-mono font-semibold bg-white/10 text-white border border-white/20">21st.dev</span>
      <span class="text-slate-600">/</span>
      <h1 class="text-sm font-mono text-slate-300">liquid-metal-button_enhanced</h1>
    </div>
    <div class="text-xs font-mono text-slate-500">Fluid Shader & 3D Layer Parallax</div>
  </header>

  <!-- Main Showcase Stage -->
  <main class="w-full max-w-6xl mx-auto flex-1 flex flex-col lg:flex-row items-center justify-center gap-10 my-8">
    
    <!-- Hero Button Display Stage -->
    <div class="flex-1 flex flex-col items-center justify-center relative py-24 px-8 rounded-2xl bg-gradient-to-b from-slate-900/40 to-slate-950/80 border border-slate-800 shadow-2xl w-full min-h-[380px]">
      <div class="absolute inset-0 bg-[radial-gradient(#ffffff0a_1px,transparent_1px)] [background-size:20px_20px] pointer-events-none rounded-2xl"></div>

      <!-- 3D Liquid Metal Button with Tilt Response -->
      <div id="tilt-anchor" class="liquid-btn-wrap relative inline-block perspective-1000 cursor-pointer">
        <div id="tilt-box" class="relative w-[160px] h-[50px] preserve-3d transition-transform duration-300">
          
          <!-- Layer 3: Label Text floating at Z: 20px -->
          <div class="layer-top absolute inset-0 flex items-center justify-center gap-2 preserve-3d liquid-btn-core pointer-events-none z-30" style="transform: translateZ(24px);">
            <i data-lucide="sparkles" class="w-4 h-4 text-slate-400 transition-transform duration-300" id="btn-icon"></i>
            <span id="btn-text" class="text-sm font-medium tracking-wide text-slate-300 whitespace-nowrap transition-all duration-300">Get Started</span>
          </div>

          <!-- Layer 2: Glossy Inner Pill at Z: 12px -->
          <div class="layer-plate absolute inset-0 preserve-3d liquid-btn-core z-20" style="transform: translateZ(12px);">
            <div class="w-[156px] h-[46px] m-[2px] rounded-full bg-gradient-to-b from-[#222222] to-[#050505] border border-white/10 shadow-inner"></div>
          </div>

          <!-- Layer 1: Metal Shader Canvas at Z: 0px -->
          <div class="layer-base absolute inset-0 preserve-3d liquid-btn-core z-10" style="transform: translateZ(0px);">
            <div class="w-[160px] h-[50px] rounded-full overflow-hidden shadow-2xl relative">
              <canvas id="shader-canvas" width="160" height="50" class="w-full h-full block rounded-full"></canvas>
            </div>
          </div>

          <!-- Invisible Trigger -->
          <button id="action-trigger" aria-label="Button action" class="absolute inset-0 bg-transparent border-0 cursor-pointer outline-none z-40 preserve-3d" style="transform: translateZ(30px);"></button>

        </div>
      </div>

      <div id="action-toast" class="text-xs font-mono text-emerald-400 opacity-0 transition-opacity duration-300 mt-6 flex items-center gap-1.5">
        <i data-lucide="check" class="w-3.5 h-3.5"></i>
        <span>Action Executed</span>
      </div>

    </div>

    <!-- Live Customizer Controls Panel -->
    <div class="w-full lg:w-96 flex flex-col gap-5 p-6 rounded-2xl bg-slate-900/40 border border-slate-800 text-sm">
      <div class="flex items-center justify-between pb-3 border-b border-slate-800">
        <h2 class="font-semibold text-slate-200">Fluid Shader Controls</h2>
        <span class="text-xs font-mono text-slate-500">Real-time GLSL</span>
      </div>

      <!-- Metal Color Presets -->
      <div class="flex flex-col gap-2">
        <label class="text-xs font-mono uppercase tracking-wider text-slate-400">Metal Formulation</label>
        <div class="grid grid-cols-3 gap-2">
          <button data-type="mercury" class="type-btn active py-2 px-2.5 rounded-lg border border-white/40 bg-white/10 text-white text-xs font-semibold text-center transition-colors">Mercury</button>
          <button data-type="gold" class="type-btn py-2 px-2.5 rounded-lg border border-slate-700 bg-slate-800/40 text-slate-300 text-xs font-semibold text-center transition-colors">Gold</button>
          <button data-type="cyan" class="type-btn py-2 px-2.5 rounded-lg border border-slate-700 bg-slate-800/40 text-slate-300 text-xs font-semibold text-center transition-colors">Cobalt</button>
        </div>
      </div>

      <!-- Fluid Speed Slider -->
      <div class="flex flex-col gap-2">
        <div class="flex justify-between items-center text-xs">
          <label class="font-mono uppercase tracking-wider text-slate-400">Flow Turbulence</label>
          <span id="speed-indicator" class="font-mono text-slate-300">1.0x</span>
        </div>
        <input id="speed-slider" type="range" min="0.4" max="2.5" step="0.1" value="1.0" class="w-full accent-white bg-slate-800 rounded-lg cursor-pointer" />
      </div>

      <!-- Button Label Input -->
      <div class="flex flex-col gap-2">
        <label class="text-xs font-mono uppercase tracking-wider text-slate-400">Button Text</label>
        <input type="text" id="btn-text-input" value="Get Started" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-slate-500 transition-colors font-mono" />
      </div>

      <!-- Mouse Gyro Parallax Toggle -->
      <div class="flex items-center justify-between">
        <div>
          <div class="text-xs font-semibold text-slate-200">3D Tilt Parallax</div>
          <div class="text-[11px] text-slate-500">Reacts to cursor coordinates</div>
        </div>
        <input type="checkbox" id="tilt-toggle" checked class="w-4 h-4 accent-white rounded cursor-pointer" />
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="w-full max-w-6xl mx-auto flex items-center justify-between pt-4 border-t border-slate-800 text-xs text-slate-500 font-mono">
    <div>Original design by @johuniq • Paper Design Shaders</div>
    <div>Multi-layer 3D CSS Canvas Engine</div>
  </footer>

  <script src="./script.js"></script>
</body>
</html>
