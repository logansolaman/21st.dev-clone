<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Fan Carousel - 1:1 Clone</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    .fan-card {
      position: absolute;
      width: 15rem;
      height: 22rem;
      border-radius: 1.25rem;
      overflow: hidden;
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      user-select: none;
      transform-origin: center bottom;
      will-change: transform, opacity;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    @media (max-width: 768px) {
      .fan-card {
        width: 11rem;
        height: 16rem;
        border-radius: 1rem;
      }
    }
  </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col justify-center items-center overflow-x-hidden m-0 p-0">
  <div class="w-screen min-h-screen flex justify-center items-center">
    <section class="flex flex-col items-center w-full py-4 lg:py-8 px-4 md:px-8 relative z-20">
      <div class="flex items-center justify-center w-full max-w-[90rem]">
        
        <!-- Previous Arrow Button -->
        <button id="btn-prev" aria-label="Previous card" class="relative flex items-center justify-center w-12 h-12 rounded-full border-[1.5px] border-white/10 bg-white/5 backdrop-blur-[16px] text-white/55 cursor-pointer shrink-0 z-30 outline-none shadow-[0_4px_20px_rgba(0,0,0,0.4)] hover:border-white/25 hover:text-white/80 active:opacity-70 transition-colors duration-300 mr-4 md:mr-8">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6"/>
          </svg>
        </button>

        <!-- Fan Container -->
        <div class="fan-layout flex relative justify-center items-center w-full max-w-[80rem] h-[28rem] md:h-[34rem]" id="fan-container">
          <!-- Cards will be injected by script.js -->
        </div>

        <!-- Next Arrow Button -->
        <button id="btn-next" aria-label="Next card" class="relative flex items-center justify-center w-12 h-12 rounded-full border-[1.5px] border-white/10 bg-white/5 backdrop-blur-[16px] text-white/55 cursor-pointer shrink-0 z-30 outline-none shadow-[0_4px_20px_rgba(0,0,0,0.4)] hover:border-white/25 hover:text-white/80 active:opacity-70 transition-colors duration-300 ml-4 md:ml-8">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 18 6-6-6-6"/>
          </svg>
        </button>

      </div>
    </section>
  </div>

  <script src="./script.js"></script>
</body>
</html>
