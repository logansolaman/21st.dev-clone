<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stacked Card Carousel (carousel-07) - ShadcnSpace (1:1 Clone)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: 'var(--background)',
            foreground: 'var(--foreground)',
            muted: 'var(--muted)',
            'muted-foreground': 'var(--muted-foreground)',
            card: 'var(--card)',
            'card-foreground': 'var(--card-foreground)',
            primary: 'var(--primary)',
            'primary-foreground': 'var(--primary-foreground)',
            border: 'var(--border)',
          },
          spacing: {
            '112': '28rem',
            '128': '32rem',
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --background: oklch(100% 0 0);
      --foreground: oklch(14.5% 0 0);
      --muted: oklch(97% 0 0);
      --muted-foreground: oklch(55.6% 0 0);
      --card: oklch(100% 0 0);
      --card-foreground: oklch(14.5% 0 0);
      --primary: oklch(20.5% 0 0);
      --primary-foreground: oklch(98.5% 0 0);
      --border: oklch(92.2% 0 0);
    }
    html.dark {
      --background: oklch(14.5% 0 0);
      --foreground: oklch(98.5% 0 0);
      --muted: oklch(26.9% 0 0);
      --muted-foreground: oklch(70.8% 0 0);
      --card: oklch(20.5% 0 0);
      --card-foreground: oklch(98.5% 0 0);
      --primary: oklch(98.5% 0 0);
      --primary-foreground: oklch(20.5% 0 0);
      --border: oklch(100% 0 0 / 0.1);
    }
    body {
      background-color: var(--background);
      color: var(--foreground);
    }
    .carousel-card {
      will-change: transform, opacity;
      transform-origin: center center;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center select-none overflow-x-hidden bg-background text-foreground transition-colors duration-200">

  <!-- Theme Toggle -->
  <div class="fixed top-4 right-4 z-50">
    <button id="theme-toggle" class="px-3 py-1.5 text-xs font-medium border border-border rounded-lg bg-muted text-foreground shadow-sm hover:opacity-80 transition-opacity">
      Toggle Theme
    </button>
  </div>

  <div class="flex flex-col items-center justify-center w-full py-10 bg-background overflow-hidden select-none">
    <div id="carousel-viewport" class="relative w-full max-w-7xl h-80 sm:h-112 lg:h-128 flex items-center justify-center">
      
      <!-- Invisible Drag Touch Layer -->
      <div id="drag-surface" class="absolute inset-0 z-50 cursor-grab active:cursor-grabbing"></div>

      <!-- Slides Container -->
      <div id="slides-container" class="relative w-full h-full flex items-center justify-center">
        <!-- Rendered via JS -->
      </div>

    </div>

    <!-- Navigation indicators / arrows for accessibility & convenience -->
    <div class="mt-6 flex items-center gap-4 z-50">
      <button id="btn-prev" aria-label="Previous Slide" class="p-2 rounded-full border border-border bg-muted hover:bg-muted/80 text-foreground transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 18-6-6 6-6"/>
        </svg>
      </button>
      <span id="slide-indicator" class="text-xs font-mono font-medium text-muted-foreground">
        1 / 5
      </span>
      <button id="btn-next" aria-label="Next Slide" class="p-2 rounded-full border border-border bg-muted hover:bg-muted/80 text-foreground transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m9 18 6-6-6-6"/>
        </svg>
      </button>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
