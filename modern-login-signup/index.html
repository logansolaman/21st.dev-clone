<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modern Login &amp; Signup — 21st.dev Clone</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: #000;
      color: #fff;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #000;
    }
    #field {
      position: absolute;
      inset: 0;
      z-index: 0;
      display: block;
      width: 100%;
      height: 100%;
    }
    .vignette {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: radial-gradient(circle, rgba(0, 0, 0, 0.75) 0%, rgba(0, 0, 0, 0) 100%);
      pointer-events: none;
    }

    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 400px;
      padding: 2rem;
      border-radius: 12px;
      background: #121212;
      border: 1px solid #222;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .inner {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #111;
      border: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.15rem;
      margin-bottom: 0.75rem;
      letter-spacing: 0.01em;
    }
    h1 {
      margin: 0 0 0.25rem;
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.025em;
    }
    .sub {
      margin: 0 0 0.85rem;
      font-size: 0.85rem;
      color: #888;
      line-height: 1.5;
    }

    form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }
    input {
      width: 100%;
      padding: 0.65rem 0.85rem;
      border-radius: 6px;
      border: 1px solid #333;
      background: #000;
      color: #fff;
      font: inherit;
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.16s ease, box-shadow 0.16s ease;
    }
    input::placeholder { color: #6b6b6b; }
    input:focus {
      border-color: #666;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.08);
    }
    input[aria-invalid="true"] { border-color: #b3261e; }

    button {
      cursor: pointer;
      font-family: inherit;
      transition: background 0.16s ease, border-color 0.16s ease, opacity 0.16s ease;
    }
    button:focus-visible, a:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

    .primary {
      width: 100%;
      padding: 0.65rem;
      border: 0;
      border-radius: 6px;
      background: #ededed;
      color: #000;
      font-weight: 500;
      font-size: 0.875rem;
    }
    .primary:hover { background: #fff; }

    .divider {
      height: 1px;
      background: #222;
      width: 100%;
      margin: 0.85rem 0;
    }

    .oauth {
      width: 100%;
      padding: 0.65rem;
      border-radius: 6px;
      border: 1px solid #333;
      background: transparent;
      color: #fff;
      font-weight: 500;
      font-size: 0.875rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 0.4rem;
    }
    .oauth:last-of-type { margin-bottom: 0; }
    .oauth:hover { background: #1a1a1a; border-color: #444; }
    .oauth svg { width: 16px; height: 16px; flex-shrink: 0; }

    .switch {
      margin-top: 1.25rem;
      font-size: 0.875rem;
      color: #888;
    }
    .switch button {
      color: #fff;
      font-weight: 500;
      background: none;
      border: 0;
      padding: 0;
      font-size: inherit;
    }
    .switch button:hover { text-decoration: underline; }

    .legal {
      margin-top: 0.85rem;
      font-size: 0.75rem;
      color: #666;
      line-height: 1.5;
      text-align: center;
    }
    .legal a { color: #888; text-decoration: none; }
    .legal a:hover { color: #bbb; text-decoration: underline; }

    .status {
      margin-top: 0;
      font-size: 0.75rem;
      color: #8fd3a0;
      opacity: 0;
      max-height: 0;
      overflow: hidden;
      transition: opacity 0.2s ease, margin-top 0.2s ease, max-height 0.2s ease;
    }
    .status.is-on { opacity: 1; margin-top: 0.75rem; max-height: 3rem; }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.001s !important; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <canvas id="field" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>

    <div class="card">
      <div class="inner">
        <div class="avatar" aria-hidden="true">JS</div>
        <h1 id="title">Sign in to Account</h1>
        <p class="sub" id="sub">Sign in to your Account.</p>

        <form id="form" novalidate>
          <label class="sr" for="email" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Email</label>
          <input id="email" type="email" placeholder="name@work-email.com" autocomplete="email" required />
          <button class="primary" type="submit" id="submit">Continue with Email</button>
        </form>

        <div class="divider" aria-hidden="true"></div>

        <button class="oauth" type="button" data-provider="Google">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"></path>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"></path>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"></path>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"></path>
          </svg>
          Continue with Google
        </button>

        <button class="oauth" type="button" data-provider="GitHub">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.699-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.462-1.11-1.462-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.379.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.577.688.48C19.138 20.161 22 16.416 22 12c0-5.523-4.477-10-10-10z"></path>
          </svg>
          Continue with GitHub
        </button>

        <button class="oauth" type="button" data-provider="Apple" style="margin-bottom:0">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.04 2.26-.79 3.59-.76 1.56.04 2.88.75 3.65 1.89-3.08 1.75-2.58 5.61.35 6.75-1.01 2.37-2.39 4.39-4.29 4.29zM12.03 7.25c-.15-2.23 1.66-4.07 3.72-4.25.36 2.38-1.92 4.34-3.72 4.25z"></path>
          </svg>
          Continue with Apple
        </button>

        <div class="switch">
          <span id="switchText">Don't have an account?</span>
          <button type="button" id="switchBtn">Sign Up</button>
        </div>

        <div class="legal">
          By proceeding, you agree to creating a Vercel account<br />
          subject to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
        </div>

        <p class="status" id="status" role="status" aria-live="polite"></p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
