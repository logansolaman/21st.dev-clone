<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chapter Scrubber Enhanced - Interactive Agent Transcript Minimap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: 'var(--background)',
            foreground: 'var(--foreground)',
            card: 'var(--card)',
            'card-foreground': 'var(--card-foreground)',
            popover: 'var(--popover)',
            'popover-foreground': 'var(--popover-foreground)',
            primary: 'var(--primary)',
            'primary-foreground': 'var(--primary-foreground)',
            muted: 'var(--muted)',
            'muted-foreground': 'var(--muted-foreground)',
            border: 'var(--border)',
            ring: 'var(--ring)',
          },
          borderRadius: {
            '2xl': '1rem',
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --background: oklch(98.5% 0 0);
      --foreground: oklch(14.5% 0 0);
      --card: oklch(100% 0 0);
      --card-foreground: oklch(14.5% 0 0);
      --popover: oklch(100% 0 0);
      --popover-foreground: oklch(14.5% 0 0);
      --primary: oklch(48% 0.22 260);
      --primary-foreground: oklch(98.5% 0 0);
      --muted: oklch(94% 0 0);
      --muted-foreground: oklch(50% 0 0);
      --border: oklch(90% 0 0);
      --ring: oklch(60% 0.15 260);
    }
    html.dark {
      --background: #090a0f;
      --foreground: #f3f4f6;
      --card: #11131a;
      --card-foreground: #f3f4f6;
      --popover: #11131c;
      --popover-foreground: #f3f4f6;
      --primary: #6366f1;
      --primary-foreground: #ffffff;
      --muted: #1e222f;
      --muted-foreground: #9ca3af;
      --border: rgba(255, 255, 255, 0.08);
      --ring: #818cf8;
    }
    body {
      background-color: var(--background);
      color: var(--foreground);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .scrubber-tick {
      transition: width 0.04s ease-out, opacity 0.04s ease-out;
      transform-origin: left center;
    }
    .glow-effect {
      box-shadow: 0 0 25px -5px rgba(99, 102, 241, 0.35);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center select-none bg-background text-foreground transition-colors duration-200">

  <!-- Top bar controls -->
  <header class="w-full max-w-6xl px-6 py-4 flex items-center justify-between border-b border-border/50">
    <div class="flex items-center gap-3">
      <div class="w-7 h-7 rounded-lg bg-primary/20 border border-primary/40 flex items-center justify-center text-primary font-bold text-sm">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 17 10 11 4 5"></polyline>
          <line x1="12" y1="19" x2="20" y2="19"></line>
        </svg>
      </div>
      <div>
        <h1 class="text-sm font-semibold tracking-tight">Agent Run Minimap & Chapter Scrubber</h1>
        <p class="text-xs text-muted-foreground">Interactive step debugger with synced log stream</p>
      </div>
    </div>

    <div class="flex items-center gap-4 text-xs">
      <div class="flex items-center gap-2">
        <span class="text-muted-foreground">Side:</span>
        <button id="toggle-side" class="px-2.5 py-1 rounded bg-muted hover:bg-muted/80 text-foreground font-medium transition-colors">
          Right
        </button>
      </div>
      <button id="theme-toggle" class="px-3 py-1 rounded border border-border bg-popover text-foreground hover:bg-muted transition-colors font-medium">
        Theme
      </button>
    </div>
  </header>

  <!-- Main Showcase Container -->
  <main class="w-full max-w-6xl flex-1 flex flex-col md:flex-row items-stretch gap-8 px-6 py-8">
    
    <!-- Left / Center: Interactive Transcript Feed -->
    <div class="flex-1 flex flex-col bg-card/60 border border-border/60 rounded-2xl p-6 shadow-sm overflow-hidden relative">
      <div class="flex items-center justify-between pb-4 border-b border-border/40 mb-4">
        <div class="flex items-center gap-2.5">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
          <span class="text-xs font-semibold uppercase tracking-wider text-muted-foreground">Active Step Log</span>
        </div>
        <span id="current-step-badge" class="text-xs px-2.5 py-0.5 rounded-full bg-primary/10 text-primary font-mono font-medium">
          Step 1 of 20
        </span>
      </div>

      <!-- Live transcript viewer scroll pane -->
      <div id="transcript-scroll" class="flex-1 overflow-y-auto space-y-3 pr-2 scroll-smooth max-h-[580px]">
        <!-- Populated via script -->
      </div>
    </div>

    <!-- Right: Chapter Scrubber Dock & Preview Panel -->
    <div class="w-full md:w-80 flex flex-col items-center justify-center p-6 bg-card/30 border border-border/40 rounded-2xl relative min-h-[580px]">
      <div class="text-xs text-muted-foreground font-medium mb-6 text-center">
        Hover or drag cursor vertically along rail
      </div>
      
      <!-- Scrubber container mount -->
      <div id="enhanced-scrubber-mount" class="relative"></div>

      <div class="mt-8 text-[11px] text-muted-foreground/75 text-center leading-relaxed max-w-[200px]">
        Supports keyboard navigation (<kbd class="px-1 py-0.5 rounded bg-muted text-foreground">↑</kbd><kbd class="px-1 py-0.5 rounded bg-muted text-foreground">↓</kbd>), Home, End, and Enter to inspect.
      </div>
    </div>

  </main>

  <script src="./script.js"></script>
</body>
</html>
