<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expandable Tabs — 21st.dev Clone</title>
  <style>
    :root {
      --background: #ffffff;
      --foreground: #0a0a0a;
      --muted: #f5f5f5;
      --muted-foreground: #737373;
      --border: #e5e5e5;
      --accent: #f5f5f5;
      --dot: rgba(0, 0, 0, 0.13);
    }
    html.dark {
      --background: #0a0a0a;
      --foreground: #fafafa;
      --muted: #262626;
      --muted-foreground: #a3a3a3;
      --border: #262626;
      --accent: #262626;
      --dot: rgba(255, 255, 255, 0.13);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100svh;
      background: var(--background);
      color: var(--foreground);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
      padding: 64px;
    }
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(var(--dot) 1px, transparent 1px);
      background-size: 16px 16px;
      pointer-events: none;
    }

    .stack {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    /* ---- the tab bar ---- */
    .tabs {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 2px;
      padding: 4px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--background);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .tab {
      position: relative;
      display: flex;
      align-items: center;
      gap: 0;
      padding: 8px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--muted-foreground);
      font: 500 14px/1 inherit;
      white-space: nowrap;
      cursor: pointer;
      overflow: hidden;
      transition:
        background 0.3s ease,
        color 0.3s ease,
        gap 0.35s cubic-bezier(0.22, 1, 0.36, 1),
        padding 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .tab svg { width: 20px; height: 20px; flex: none; }
    .tab .label {
      max-width: 0;
      opacity: 0;
      overflow: hidden;
      transition:
        max-width 0.35s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.25s ease,
        margin 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      margin-left: 0;
    }
    .tab:hover { background: var(--muted); color: var(--foreground); }
    .tab:focus-visible { outline: 2px solid var(--foreground); outline-offset: 1px; }

    .tab[aria-selected="true"] {
      gap: 6px;
      padding-left: 12px;
      padding-right: 14px;
      color: var(--accent-color, var(--foreground));
      background: transparent;
    }
    .tab[aria-selected="true"] .label {
      max-width: 12rem;
      opacity: 1;
      margin-left: 0;
    }
    .tab[aria-selected="true"]:hover { background: transparent; }

    /* sliding highlight behind the active tab */
    .glider {
      position: absolute;
      z-index: 0;
      border-radius: 12px;
      background: var(--muted);
      box-shadow: inset 0 0 0 1px var(--border);
      transition:
        transform 0.36s cubic-bezier(0.22, 1, 0.36, 1),
        width 0.36s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.2s ease;
      pointer-events: none;
      opacity: 0;
    }
    .tabs.has-active .glider { opacity: 1; }

    .sep {
      width: 1px;
      height: 24px;
      margin: 0 2px;
      background: var(--border);
      flex: none;
    }

    .hint {
      position: relative;
      z-index: 1;
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10.5px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted-foreground);
      opacity: 0.7;
    }

    @media (prefers-reduced-motion: reduce) {
      .tab, .tab .label, .glider { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="stack">
    <div class="tabs" id="tabs" role="tablist" aria-label="Main navigation"></div>
    <p class="hint" id="hint">Click a tab to expand it</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
