<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flip Card - Animate UI (1:1 Clone)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: 'var(--background)',
            foreground: 'var(--foreground)',
            muted: 'var(--muted)',
            'muted-foreground': 'var(--muted-foreground)',
            primary: 'var(--primary)',
            'primary-foreground': 'var(--primary-foreground)',
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --background: oklch(100% 0 0);
      --foreground: oklch(14.5% 0 0);
      --muted: oklch(97% 0 0);
      --muted-foreground: oklch(55.6% 0 0);
      --primary: oklch(20.5% 0 0);
      --primary-foreground: oklch(98.5% 0 0);
    }
    html.dark {
      --background: oklch(14.5% 0 0);
      --foreground: oklch(98.5% 0 0);
      --muted: oklch(26.9% 0 0);
      --muted-foreground: oklch(70.8% 0 0);
      --primary: oklch(98.5% 0 0);
      --primary-foreground: oklch(20.5% 0 0);
    }
    body {
      background-color: var(--background);
      color: var(--foreground);
    }
    .perspective-1000 {
      perspective: 1000px;
    }
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .preserve-3d {
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
    }
    .card-face {
      transition: transform 0.5s cubic-bezier(0, 0, 0.2, 1);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 bg-background text-foreground transition-colors duration-200">

  <!-- Theme Toggle -->
  <div class="fixed top-4 right-4 z-50">
    <button id="theme-toggle" class="px-3 py-1.5 text-xs font-medium border border-foreground/20 rounded-lg bg-muted text-foreground shadow-sm hover:opacity-80 transition-opacity">
      Toggle Theme
    </button>
  </div>

  <div class="flex flex-col items-center justify-center w-full max-w-md">
    <!-- FlipCard Host -->
    <div
      id="flip-card"
      class="mt-2 relative w-40 h-60 md:w-60 md:h-80 perspective-1000 cursor-pointer mx-auto select-none"
    >
      <!-- FRONT: Profile -->
      <div
        id="card-front"
        class="card-face absolute inset-0 backface-hidden rounded-md border-2 border-foreground/20 px-4 py-6 flex flex-col items-center justify-center bg-gradient-to-br from-muted via-background to-muted text-center preserve-3d"
        style="transform: rotateY(0deg);"
      >
        <img
          id="front-image"
          src="https://pbs.twimg.com/profile_images/1950218390741618688/72447Y7e_400x400.jpg"
          alt="Animate UI"
          class="w-20 h-20 md:w-24 md:h-24 rounded-full object-cover mb-4 border-2 border-foreground/20"
        />
        <h2 id="front-name" class="text-lg font-bold text-foreground">Animate UI</h2>
        <p id="front-username" class="text-sm text-muted-foreground">@animate_ui</p>
      </div>

      <!-- BACK: Bio + Stats + Socials -->
      <div
        id="card-back"
        class="card-face absolute inset-0 backface-hidden rounded-md border-2 border-foreground/20 px-4 py-6 flex flex-col justify-between items-center gap-y-4 bg-gradient-to-tr from-muted via-background to-muted preserve-3d"
        style="transform: rotateY(180deg);"
      >
        <p id="back-bio" class="text-xs md:text-sm text-muted-foreground text-center">
          A fully animated, open-source component distribution built with React, TypeScript, Tailwind CSS, and Motion.
        </p>

        <div class="px-6 flex items-center justify-between w-full">
          <div class="text-center">
            <p id="stat-following" class="text-base font-bold">200</p>
            <p class="text-xs text-muted-foreground">Following</p>
          </div>
          <div class="text-center">
            <p id="stat-followers" class="text-base font-bold">2900</p>
            <p class="text-xs text-muted-foreground">Followers</p>
          </div>
          <div class="text-center">
            <p id="stat-posts" class="text-base font-bold">120</p>
            <p class="text-xs text-muted-foreground">Posts</p>
          </div>
        </div>

        <!-- Social Media Icons -->
        <div class="flex items-center justify-center gap-4 text-foreground">
          <a
            id="link-linkedin"
            href="https://linkedin.com"
            target="_blank"
            rel="noopener noreferrer"
            class="hover:scale-105 transition-transform"
            aria-label="LinkedIn"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/>
              <rect width="4" height="12" x="2" y="9"/>
              <circle cx="4" cy="4" r="2"/>
            </svg>
          </a>
          <a
            id="link-github"
            href="https://github.com"
            target="_blank"
            rel="noopener noreferrer"
            class="hover:scale-105 transition-transform"
            aria-label="GitHub"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/>
              <path d="M9 18c-4.51 2-5-2-7-2"/>
            </svg>
          </a>
          <a
            id="link-twitter"
            href="https://twitter.com"
            target="_blank"
            rel="noopener noreferrer"
            class="hover:scale-105 transition-transform"
            aria-label="Twitter"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.5.5 9.6 3 5c2.2 2.6 5.6 4.1 9 4-.9-4.2 4-6.6 7-3.8 1.1 0 3-1.2 3-1.2z"/>
            </svg>
          </a>
        </div>

        <!-- Follow Button -->
        <button class="px-4 py-2 text-xs font-semibold rounded-md bg-primary text-primary-foreground hover:opacity-90 transition-opacity">
          Follow
        </button>
      </div>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
