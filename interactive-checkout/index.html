<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Checkout — Kokonut UI (1:1 Clone)</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #18181b;
      --muted: #71717a;
      --card: #ffffff;
      --line: #e4e4e7;
      --line-strong: #d4d4d8;
      --chip: #f4f4f5;
      --row: #fafafa;
      --primary: #0b0b0d;
      --primary-fg: #ffffff;
      --dot: rgba(0, 0, 0, 0.13);
      --shadow: 0 1px 2px rgba(9, 9, 11, 0.04);
    }
    html.dark {
      --bg: #09090b;
      --fg: #fafafa;
      --muted: #a1a1aa;
      --card: #18181b;
      --line: #27272a;
      --line-strong: #3f3f46;
      --chip: #27272a;
      --row: rgba(39, 39, 42, 0.5);
      --primary: #fafafa;
      --primary-fg: #09090b;
      --dot: rgba(255, 255, 255, 0.13);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100svh;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto,
        "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
      padding: 64px;
    }
    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(var(--dot) 1px, transparent 1px);
      background-size: 16px 16px;
      pointer-events: none;
    }

    .shell {
      position: relative;
      width: 100%;
      max-width: 56rem;      /* max-w-4xl */
      margin: 0 auto;
    }
    .cols { display: flex; gap: 24px; align-items: flex-start; }

    /* ---------------- product list ---------------- */
    .list { flex: 1; display: flex; flex-direction: column; gap: 12px; min-width: 0; }

    .product {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
      opacity: 0;
      transform: translateY(8px);
      animation: rise 0.42s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      animation-delay: var(--d, 0ms);
    }
    @keyframes rise { to { opacity: 1; transform: none; } }
    .product:hover {
      border-color: var(--line-strong);
      box-shadow: 0 4px 14px -10px rgba(9, 9, 11, 0.4);
    }
    .product .left { display: flex; align-items: center; gap: 12px; min-width: 0; }

    .thumb {
      position: relative;
      width: 48px; height: 48px;
      flex: none;
      border-radius: 8px;
      overflow: hidden;
      background: var(--chip);
      display: grid;
      place-items: center;
      transition: background 0.2s ease;
    }
    .product:hover .thumb { background: var(--line); }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .meta { min-width: 0; }
    .name-row { display: flex; align-items: center; gap: 8px; }
    .name { font-size: 14px; font-weight: 500; letter-spacing: -0.006em; }

    .badge {
      padding: 2px 8px;
      font-size: 12px;
      line-height: 1.35;
      border-radius: 999px;
      background: var(--chip);
      color: var(--muted);
      white-space: nowrap;
    }
    .sub {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 2px;
      font-size: 14px;
      color: var(--muted);
    }

    /* ---------------- buttons ---------------- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 36px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--fg);
      font: 500 14px/1 inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.16s ease, border-color 0.16s ease, transform 0.12s ease;
    }
    .btn:hover { background: var(--chip); }
    .btn:active { transform: scale(0.985); }
    .btn:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
    .btn svg { width: 14px; height: 14px; }
    .btn.add { flex: none; }

    /* ---------------- cart panel ---------------- */
    .cart {
      width: 320px;                 /* w-80 */
      flex: none;
      display: flex;
      flex-direction: column;
      padding: 16px;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      position: sticky;
      top: 16px;
      max-height: 32rem;
    }
    .cart-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .cart-head svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
    .cart-head h2 { margin: 0; font-size: 14px; font-weight: 500; }
    .cart-head .count { font-variant-numeric: tabular-nums; }

    .lines {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 0 -16px;
      padding: 0 16px;
    }
    .empty {
      display: grid;
      place-items: center;
      padding: 34px 0 30px;
      font-size: 12.5px;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }

    .line {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px;
      border-radius: 8px;
      background: var(--row);
      animation: lineIn 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes lineIn {
      from { opacity: 0; transform: translateY(-6px) scale(0.985); }
    }
    .line.removing {
      animation: lineOut 0.2s ease forwards;
    }
    @keyframes lineOut {
      to { opacity: 0; transform: translateX(12px) scale(0.97); height: 0; padding-block: 0; margin-block: 0; }
    }
    .line .body { flex: 1; min-width: 0; }
    .line .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .line .nm { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .line .bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; }
    .line .amt { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

    .stepper { display: flex; align-items: center; gap: 4px; }
    .stepper .q {
      min-width: 18px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .icon-btn {
      display: grid;
      place-items: center;
      width: 22px; height: 22px;
      padding: 0;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--fg);
      cursor: pointer;
      transition: background 0.14s ease;
    }
    .icon-btn:hover { background: var(--line); }
    .icon-btn:focus-visible { outline: 2px solid var(--fg); outline-offset: 1px; }
    .icon-btn svg { width: 12px; height: 12px; }
    .icon-btn.remove { color: var(--muted); }
    .icon-btn.remove:hover { color: var(--fg); }

    .cart-foot {
      padding-top: 12px;
      margin-top: 12px;
      border-top: 1px solid var(--line);
    }
    .total-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .total-row .lbl { font-size: 14px; font-weight: 500; }
    .total-row .val { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }

    .checkout {
      width: 100%;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 0;
      border-radius: 8px;
      background: var(--primary);
      color: var(--primary-fg);
      font: 500 14px/1 inherit;
      cursor: pointer;
      transition: opacity 0.16s ease, transform 0.12s ease;
    }
    .checkout:hover { opacity: 0.9; }
    .checkout:active { transform: scale(0.99); }
    .checkout:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
    .checkout svg { width: 16px; height: 16px; }
    .checkout[disabled] { opacity: 0.45; cursor: not-allowed; }

    /* number-flow: rolling digits */
    .flow { display: inline-flex; align-items: baseline; line-height: 1; }
    .flow .digit {
      display: inline-block;
      height: 1em;
      overflow: hidden;
      position: relative;
    }
    .flow .digit .reel {
      display: block;
      transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }
    .flow .digit .reel span { display: block; height: 1em; line-height: 1; }
    .flow .sep { display: inline-block; }

    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    /* toast */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translate(-50%, 12px);
      padding: 9px 14px;
      border-radius: 10px;
      background: var(--primary);
      color: var(--primary-fg);
      font-size: 13px;
      box-shadow: 0 18px 36px -18px rgba(0, 0, 0, 0.6);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
      z-index: 40;
    }
    .toast.is-on { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 860px) {
      .stage { padding: 24px 16px; }
      .cols { flex-direction: column; }
      .cart { width: 100%; position: static; max-height: none; order: -1; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001s !important;
        transition-duration: 0.001s !important;
      }
      .product { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="shell">
      <div class="cols">
        <!-- product list -->
        <div class="list" id="list" role="list" aria-label="Products"></div>

        <!-- cart -->
        <aside class="cart" aria-label="Shopping cart">
          <div class="cart-head">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="8" cy="21" r="1"></circle><circle cx="19" cy="21" r="1"></circle>
              <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"></path>
            </svg>
            <h2>Cart (<span class="count" id="count">0</span>)</h2>
          </div>

          <div class="lines" id="lines" role="list" aria-live="polite">
            <p class="empty" id="empty">Your cart is empty.<br />Add a pair to get started.</p>
          </div>

          <div class="cart-foot">
            <div class="total-row">
              <span class="lbl">Total</span>
              <span class="val flow" id="total" aria-hidden="true"></span>
              <span class="sr-only" id="totalSr" aria-live="polite" aria-atomic="true">0.00</span>
            </div>
            <button class="checkout" id="checkout" type="button" disabled>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect width="20" height="14" x="2" y="5" rx="2"></rect>
                <line x1="2" x2="22" y1="10" y2="10"></line>
              </svg>
              Checkout
            </button>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
