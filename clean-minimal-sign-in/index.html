<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clean & Minimal Sign In - 1:1 Clone</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center m-0 p-0 font-sans text-black antialiased">
  
  <!-- 1:1 Clone of @preetsuthar17 / HextaUI -->
  <div class="min-h-screen w-full flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-gradient-to-b from-sky-50/50 to-white rounded-3xl shadow-xl shadow-blue-500/5 p-8 flex flex-col items-center border border-blue-100 text-black">
      
      <!-- Top Icon -->
      <div class="flex items-center justify-center w-14 h-14 rounded-2xl bg-white mb-6 shadow-md border border-gray-100">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-7 h-7 text-black">
          <path d="m10 17 5-5-5-5"></path>
          <path d="M15 12H3"></path>
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
        </svg>
      </div>

      <h2 class="text-2xl font-semibold mb-2 text-center">Sign in with email</h2>
      <p class="text-gray-500 text-sm mb-6 text-center leading-relaxed">
        Make a new doc to bring your words, data, and teams together. For free
      </p>

      <form id="signin-form" class="w-full flex flex-col gap-3 mb-2" onsubmit="event.preventDefault()">
        <!-- Email Input -->
        <div class="relative">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
              <path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"></path>
              <rect x="2" y="4" width="20" height="16" rx="2"></rect>
            </svg>
          </span>
          <input id="email-input" placeholder="Email" class="w-full pl-10 pr-3 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-200 bg-gray-50 text-black text-sm transition-all" type="email" required />
        </div>

        <!-- Password Input with Toggle -->
        <div class="relative">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </span>
          <input id="password-input" placeholder="Password" class="w-full pl-10 pr-10 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-200 bg-gray-50 text-black text-sm transition-all" type="password" required />
          <button id="toggle-pw" type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 text-xs select-none">
            Show
          </button>
        </div>

        <!-- Forgot Password -->
        <div class="w-full flex justify-end">
          <button type="button" class="text-xs text-gray-600 hover:text-black hover:underline font-medium">Forgot password?</button>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="w-full mt-1 bg-gradient-to-b from-gray-700 to-gray-900 hover:from-gray-800 hover:to-black text-white font-medium py-2.5 rounded-xl shadow-md transition-all active:scale-[0.98]">
          Get Started
        </button>
      </form>

      <!-- Divider -->
      <div class="w-full flex items-center my-5">
        <div class="flex-1 border-t border-gray-200"></div>
        <span class="px-3 text-xs text-gray-400 uppercase">Or</span>
        <div class="flex-1 border-t border-gray-200"></div>
      </div>

      <!-- Social Logins -->
      <div class="w-full flex items-center justify-between gap-2">
        <button class="flex-1 py-2 px-3 border border-gray-200 hover:bg-gray-50 rounded-xl text-xs font-medium text-gray-700 flex items-center justify-center gap-1.5 transition-colors">
          <span>Google</span>
        </button>
        <button class="flex-1 py-2 px-3 border border-gray-200 hover:bg-gray-50 rounded-xl text-xs font-medium text-gray-700 flex items-center justify-center gap-1.5 transition-colors">
          <span>Facebook</span>
        </button>
        <button class="flex-1 py-2 px-3 border border-gray-200 hover:bg-gray-50 rounded-xl text-xs font-medium text-gray-700 flex items-center justify-center gap-1.5 transition-colors">
          <span>Apple</span>
        </button>
      </div>

    </div>
  </div>

  <script>
    const togglePw = document.getElementById("toggle-pw");
    const pwInput = document.getElementById("password-input");

    togglePw.addEventListener("click", () => {
      if (pwInput.type === "password") {
        pwInput.type = "text";
        togglePw.textContent = "Hide";
      } else {
        pwInput.type = "password";
        togglePw.textContent = "Show";
      }
    });
  </script>
</body>
</html>
