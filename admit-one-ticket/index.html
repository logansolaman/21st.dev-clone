<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admit One Ticket - 1:1 Clone</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Ticket notch cutting via CSS mask and SVG clip */
    .ticket-container {
      perspective: 1000px;
    }
    .ticket-card {
      transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.3s ease;
      transform-style: preserve-3d;
    }
  </style>
</head>
<body class="bg-[#281d14] text-white min-h-screen flex items-center justify-center m-0 p-4 font-sans select-none">
  <div class="ticket-container flex items-center justify-center w-full min-h-[640px] p-4 sm:p-8">
    
    <!-- 1:1 Ticket Card for Startup School 2026 -->
    <div id="ticket-el" class="ticket-card relative w-full max-w-[740px] h-[260px] sm:h-[280px] rounded-3xl bg-[#f5efe6] text-[#281d14] shadow-2xl flex overflow-hidden border border-[#d8ccbe] cursor-pointer">
      
      <!-- Main Stub Left Side -->
      <div class="flex-1 p-6 sm:p-8 flex flex-col justify-between relative border-r-2 border-dashed border-[#d8ccbe]">
        
        <!-- Top Metadata -->
        <div class="flex justify-between items-start">
          <div>
            <span class="text-[11px] font-mono uppercase tracking-widest text-[#8c7b6d] font-semibold">Y Combinator presents</span>
            <h2 class="text-2xl sm:text-3xl font-black tracking-tight text-[#281d14] mt-0.5">Startup School 2026</h2>
          </div>
          <span class="text-2xl sm:text-3xl font-black text-[#281d14]/15 font-mono select-none">2026</span>
        </div>

        <!-- Middle Venue & Dates -->
        <div class="flex items-center gap-8 text-xs sm:text-sm font-medium text-[#5c4f43]">
          <div>
            <span class="block text-[10px] font-mono uppercase text-[#8c7b6d]">Venue</span>
            <span class="font-bold text-[#281d14]">Chase Center, SF</span>
          </div>
          <div>
            <span class="block text-[10px] font-mono uppercase text-[#8c7b6d]">Dates</span>
            <span class="font-bold text-[#281d14]">July 25–26</span>
          </div>
        </div>

        <!-- Bottom Attendee Info -->
        <div class="flex justify-between items-end pt-3 border-t border-[#e2d7c9]">
          <div>
            <span class="text-[10px] font-mono uppercase tracking-wider text-[#8c7b6d]">Admit One / Attendee</span>
            <h4 class="text-base sm:text-lg font-bold text-[#281d14]">Garry Tan</h4>
          </div>
          <!-- Barcode simulation -->
          <div class="flex items-center gap-1 opacity-70">
            <div class="w-1 h-8 bg-black"></div>
            <div class="w-2 h-8 bg-black"></div>
            <div class="w-0.5 h-8 bg-black"></div>
            <div class="w-1.5 h-8 bg-black"></div>
            <div class="w-1 h-8 bg-black"></div>
            <div class="w-3 h-8 bg-black"></div>
            <div class="w-0.5 h-8 bg-black"></div>
            <div class="w-1 h-8 bg-black"></div>
          </div>
        </div>

        <!-- Half-circle Notch cutout top & bottom -->
        <div class="absolute -right-3 -top-3 w-6 h-6 rounded-full bg-[#281d14]"></div>
        <div class="absolute -right-3 -bottom-3 w-6 h-6 rounded-full bg-[#281d14]"></div>
      </div>

      <!-- Right Tear-off Stub -->
      <div class="w-44 sm:w-52 p-6 bg-[#eee4d7] flex flex-col justify-between items-center text-center relative">
        <div class="w-full flex justify-between items-center text-[10px] font-mono text-[#8c7b6d]">
          <span>GATE 04</span>
          <span>SEC A</span>
        </div>

        <!-- Vertical Branding -->
        <div class="my-auto flex flex-col items-center">
          <span class="text-xs font-mono uppercase tracking-widest text-[#8c7b6d]">VIP PASS</span>
          <span class="text-lg font-black tracking-tight text-[#281d14] mt-1">#YC-2026-881</span>
        </div>

        <div class="w-full text-center">
          <span class="text-[10px] font-mono uppercase text-[#8c7b6d] tracking-wider block">Admit One</span>
          <span class="text-[9px] text-[#8c7b6d]/60 font-mono">NON-TRANSFERABLE</span>
        </div>
      </div>

    </div>

  </div>

  <script>
    const ticket = document.getElementById("ticket-el");
    ticket.addEventListener("mousemove", (e) => {
      const rect = ticket.getBoundingClientRect();
      const x = e.clientX - rect.left - rect.width / 2;
      const y = e.clientY - rect.top - rect.height / 2;

      const rotX = (y / (rect.height / 2)) * -9;
      const rotY = (x / (rect.width / 2)) * 9;

      ticket.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg) scale(1.02)`;
    });

    ticket.addEventListener("mouseleave", () => {
      ticket.style.transform = "rotateX(0deg) rotateY(0deg) scale(1)";
    });
  </script>
</body>
</html>
