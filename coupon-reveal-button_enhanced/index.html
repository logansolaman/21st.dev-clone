<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coupon Reveal Button (Enhanced E-Commerce Studio)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: "Plus Jakarta Sans", sans-serif;
      background-color: #090d16;
      background-image:
        radial-gradient(circle at 50% 15%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(129, 140, 248, 0.05) 0%, transparent 40%),
        linear-gradient(to bottom, transparent, rgba(3, 7, 18, 0.95));
    }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col justify-between p-4 md:p-8 select-none">

  <!-- Top bar -->
  <header class="w-full max-w-6xl mx-auto flex items-center justify-between pb-4 border-b border-slate-800">
    <div class="flex items-center gap-2">
      <span class="px-2 py-0.5 rounded text-xs font-mono font-semibold bg-blue-500/10 text-blue-400 border border-blue-500/25">21st.dev</span>
      <span class="text-slate-600">/</span>
      <h1 class="text-sm font-mono text-slate-300">coupon-reveal-button_enhanced</h1>
    </div>
    <div class="text-xs font-mono text-slate-500">Sticker Peel & Voucher Engine</div>
  </header>

  <!-- Showcase Container -->
  <main class="w-full max-w-6xl mx-auto flex-1 flex flex-col lg:flex-row items-center justify-center gap-10 my-8">
    
    <!-- Hero Button Display Stage -->
    <div class="flex-1 flex flex-col items-center justify-center relative py-20 px-8 rounded-2xl bg-gradient-to-b from-slate-900/40 to-slate-950/80 border border-slate-800 shadow-2xl w-full min-h-[380px]">
      <div class="absolute inset-0 bg-[radial-gradient(#3b82f612_1px,transparent_1px)] [background-size:20px_20px] pointer-events-none rounded-2xl"></div>

      <!-- Live Coupon Button Container -->
      <div class="relative z-10 flex flex-col items-center gap-6 w-full max-w-sm">
        
        <button id="enh-btn" class="group relative w-full h-14 rounded-xl font-medium text-sm overflow-visible select-none outline-none transition-all duration-200 active:scale-[0.98] focus-visible:ring-2 focus-visible:ring-blue-500 shadow-lg cursor-pointer">
          
          <!-- Dashed Underplate -->
          <div id="enh-backplate" class="absolute inset-0 flex items-center justify-center rounded-xl border-2 border-dashed transition-colors duration-300 bg-blue-500/10 border-blue-500 text-blue-400 shadow-[inset_0_2px_4px_rgba(59,130,246,0.06)]">
            <div class="relative flex w-full items-center justify-center px-4 text-center font-semibold">
              
              <!-- Revealed Code Details -->
              <div id="enh-reveal" class="absolute inset-0 flex items-center justify-center gap-2 transition-all duration-200 opacity-0">
                <span id="enh-pill" class="font-mono font-bold px-2.5 py-1 rounded-md text-xs tracking-wider bg-blue-500/20 text-blue-300 border border-blue-500/30">SEADON20</span>
                <div id="enh-copy-badge" class="flex items-center gap-1 text-xs opacity-75">
                  <i data-lucide="copy" class="w-3.5 h-3.5 animate-pulse"></i>
                  <span>Click to copy</span>
                </div>
                <!-- Copied Success message -->
                <div id="enh-copied" class="hidden flex items-center gap-1.5 font-bold text-emerald-400 text-xs">
                  <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                  <span>Code Copied to Clipboard!</span>
                </div>
              </div>

              <!-- Unpeeled Back Hint -->
              <span id="enh-back-hint" class="absolute inset-0 flex items-center justify-center text-xs font-semibold tracking-wide transition-opacity duration-200 opacity-100 text-slate-300">
                🎉 Discount voucher revealed below!
              </span>

            </div>
          </div>

          <!-- Peeling Front Mask Layer -->
          <div id="enh-front" class="pointer-events-none absolute inset-0 flex items-center justify-center rounded-xl text-white font-bold tracking-wide shadow-md transition-all duration-400" style="clip-path: polygon(0px 0px, 340px 0px, 310px 100%, 0px 100%); background: linear-gradient(135deg, #3b82f6, #1d4ed8);">
            <div class="flex items-center gap-2 px-6">
              <i data-lucide="ticket" class="w-4 h-4 text-blue-200"></i>
              <span id="enh-front-text">Reveal 20% Off Coupon</span>
            </div>
          </div>

          <!-- Dogear Peel Fold -->
          <div id="enh-flap" class="pointer-events-none absolute -top-1 origin-bottom-left transition-all duration-400" style="height: 62px; width: 54px; left: 295px;">
            <svg width="54" height="62" viewBox="0 0 48 56" fill="none" xmlns="http://www.w3.org/2000/svg" class="drop-shadow-[-4px_5px_6px_rgba(0,0,0,0.3)]">
              <path d="M 36 4 L 12 52 L 28 56 Z" fill="url(#enhGradient)"></path>
              <defs>
                <linearGradient id="enhGradient" x1="36" y1="4" x2="18" y2="54" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.4"></stop>
                  <stop offset="35%" stop-color="#3b82f6" stop-opacity="0.8"></stop>
                  <stop offset="100%" stop-color="#1d4ed8" stop-opacity="1"></stop>
                </linearGradient>
              </defs>
            </svg>
          </div>

        </button>

        <div class="flex items-center gap-2 text-xs font-mono text-slate-400">
          <span class="inline-block w-2 h-2 rounded-full bg-blue-400 animate-ping"></span>
          <span>Hover to preview peek • Click to peel & copy</span>
        </div>

      </div>
    </div>

    <!-- Live Customizer Controls Panel -->
    <div class="w-full lg:w-96 flex flex-col gap-5 p-6 rounded-2xl bg-slate-900/40 border border-slate-800 text-sm">
      <div class="flex items-center justify-between pb-3 border-b border-slate-800">
        <h2 class="font-semibold text-slate-200">Voucher Settings</h2>
        <span class="text-xs font-mono text-slate-500">Live Editor</span>
      </div>

      <!-- Theme Switcher -->
      <div class="flex flex-col gap-2">
        <label class="text-xs font-mono uppercase tracking-wider text-slate-400">Color Palette</label>
        <div class="grid grid-cols-3 gap-2">
          <button data-theme="blue" class="theme-btn active py-2 px-2.5 rounded-lg border border-blue-500/50 bg-blue-500/10 text-blue-400 text-xs font-semibold text-center transition-colors">Cobalt</button>
          <button data-theme="emerald" class="theme-btn py-2 px-2.5 rounded-lg border border-slate-700 bg-slate-800/40 text-slate-300 text-xs font-semibold text-center transition-colors">Emerald</button>
          <button data-theme="violet" class="theme-btn py-2 px-2.5 rounded-lg border border-slate-700 bg-slate-800/40 text-slate-300 text-xs font-semibold text-center transition-colors">Purple</button>
        </div>
      </div>

      <!-- Coupon Code Input -->
      <div class="flex flex-col gap-2">
        <label class="text-xs font-mono uppercase tracking-wider text-slate-400">Coupon Code</label>
        <input type="text" id="coupon-input" value="SEADON20" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500 transition-colors font-mono uppercase" />
      </div>

      <!-- Front Label Input -->
      <div class="flex flex-col gap-2">
        <label class="text-xs font-mono uppercase tracking-wider text-slate-400">Front CTA Label</label>
        <input type="text" id="front-input" value="Reveal 20% Off Coupon" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500 transition-colors" />
      </div>

      <!-- Reset State Button -->
      <button id="reset-state-btn" class="flex items-center justify-center gap-2 w-full py-2.5 rounded-lg border border-slate-700 bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-200 transition-colors">
        <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
        <span>Reset Sticker Peel</span>
      </button>
    </div>

  </main>

  <!-- Footer -->
  <footer class="w-full max-w-6xl mx-auto flex items-center justify-between pt-4 border-t border-slate-800 text-xs text-slate-500 font-mono">
    <div>Original component by @shadcnspace (Button-26)</div>
    <div>SVG Gradient Flap • Interactive Clipboard API</div>
  </footer>

  <script src="./script.js"></script>
</body>
</html>
