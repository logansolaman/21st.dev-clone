<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pricing Card - 1:1 Clone</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen flex items-center justify-center m-0 p-4 font-sans selection:bg-white selection:text-black">
  <div class="flex items-center justify-center w-full min-h-screen p-4 sm:p-8">
    
    <!-- 1:1 Card Shell -->
    <div class="w-full max-w-[450px] flex flex-col gap-6 p-5 px-4 sm:p-6 rounded-3xl border border-neutral-800 bg-neutral-950 shadow-sm transition-colors duration-300">
      
      <!-- Top Header & Segmented Interval Switcher -->
      <div class="flex flex-col gap-4 mb-2">
        <h1 class="text-2xl font-semibold text-white tracking-tight">Select a Plan</h1>
        
        <div class="bg-neutral-900 p-1 h-10 w-full rounded-xl ring-1 ring-neutral-800 flex relative">
          <!-- Monthly Button -->
          <button id="btn-monthly" class="flex-1 h-full rounded-lg text-sm font-medium relative transition-colors duration-300 text-white flex items-center justify-center cursor-pointer">
            <div id="slider-monthly" class="absolute inset-0 bg-neutral-950 rounded-lg shadow-sm ring-1 ring-neutral-800 transition-opacity"></div>
            <span class="relative z-10">Monthly</span>
          </button>
          
          <!-- Yearly Button -->
          <button id="btn-yearly" class="flex-1 h-full rounded-lg text-sm font-medium relative transition-colors duration-300 flex items-center justify-center gap-2 text-neutral-400 hover:text-white cursor-pointer">
            <div id="slider-yearly" class="absolute inset-0 bg-neutral-950 rounded-lg shadow-sm ring-1 ring-neutral-800 opacity-0 transition-opacity"></div>
            <span class="relative z-10">Yearly</span>
            <span class="relative z-10 bg-white text-black text-[10px] font-bold px-1.5 py-0.5 rounded-full uppercase tracking-tight">20% OFF</span>
          </button>
        </div>
      </div>

      <!-- Tier Cards List -->
      <div class="flex flex-col gap-3" id="tiers-list">
        
        <!-- 1. Plus Tier -->
        <div class="tier-card relative cursor-pointer" data-id="plus">
          <div class="card-inner relative rounded-xl bg-neutral-900/60 border border-neutral-800 transition-all duration-300 p-5">
            <div class="flex justify-between items-start">
              <div class="flex gap-4">
                <div class="mt-1 shrink-0">
                  <div class="radio-circle w-6 h-6 rounded-full border-2 border-neutral-700 flex items-center justify-center transition-all duration-300"></div>
                </div>
                <div>
                  <h3 class="text-lg font-medium text-white leading-tight">Plus</h3>
                  <p class="text-sm text-neutral-400 lowercase">solo</p>
                </div>
              </div>
              <div class="text-right">
                <div class="text-xl font-medium text-white font-mono"><span class="price-val">$12</span></div>
                <div class="text-xs text-neutral-500 flex items-center justify-end gap-1">Month</div>
              </div>
            </div>
          </div>
        </div>

        <!-- 2. Standard Tier (Selected by default) -->
        <div class="tier-card relative cursor-pointer" data-id="standard">
          <div class="card-inner relative rounded-xl bg-neutral-900/60 border-2 border-white transition-all duration-300 p-5">
            <div class="flex justify-between items-start">
              <div class="flex gap-4">
                <div class="mt-1 shrink-0">
                  <div class="radio-circle w-6 h-6 rounded-full border-2 border-white flex items-center justify-center transition-all duration-300">
                    <div class="w-3.5 h-3.5 rounded-full bg-white"></div>
                  </div>
                </div>
                <div>
                  <h3 class="text-lg font-medium text-white leading-tight">Standard</h3>
                  <p class="text-sm text-neutral-400 lowercase">startup</p>
                </div>
              </div>
              <div class="text-right">
                <div class="text-xl font-medium text-white font-mono"><span class="price-val">$24</span></div>
                <div class="text-xs text-neutral-500 flex items-center justify-end gap-1">Month</div>
              </div>
            </div>
          </div>
        </div>

        <!-- 3. Advanced Tier -->
        <div class="tier-card relative cursor-pointer" data-id="advanced">
          <div class="card-inner relative rounded-xl bg-neutral-900/60 border border-neutral-800 transition-all duration-300 p-5">
            <div class="flex justify-between items-start">
              <div class="flex gap-4">
                <div class="mt-1 shrink-0">
                  <div class="radio-circle w-6 h-6 rounded-full border-2 border-neutral-700 flex items-center justify-center transition-all duration-300"></div>
                </div>
                <div>
                  <h3 class="text-lg font-medium text-white leading-tight">Advanced</h3>
                  <p class="text-sm text-neutral-400 lowercase">enterprise</p>
                </div>
              </div>
              <div class="text-right">
                <div class="text-xl font-medium text-white font-mono"><span class="price-val">$48</span></div>
                <div class="text-xs text-neutral-500 flex items-center justify-end gap-1">Month</div>
              </div>
            </div>
          </div>
        </div>

      </div>

      <!-- Action Button -->
      <button id="cta-btn" class="w-full py-3 rounded-xl bg-white text-black font-semibold text-sm hover:bg-neutral-200 transition-colors cursor-pointer">
        Continue with Standard
      </button>

    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
