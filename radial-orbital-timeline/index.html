<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radial Orbital Timeline</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @keyframes ping-slow {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    .animate-ping-slow {
      animation: ping-slow 2.4s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    .perspective-1000 {
      perspective: 1000px;
    }
  </style>
</head>
<body class="bg-black text-white m-0 p-0 overflow-hidden font-sans selection:bg-white selection:text-black">
  <div id="radial-container" class="w-full h-screen flex flex-col items-center justify-center bg-black overflow-hidden relative cursor-default select-none">
    <!-- Center wrapper with perspective -->
    <div class="relative w-full max-w-4xl h-full flex items-center justify-center">
      <div id="orbital-stage" class="absolute w-full h-full flex items-center justify-center perspective-1000" style="transform: translate(0px, 0px);">
        
        <!-- Central Sun / Energy core -->
        <div class="absolute w-16 h-16 rounded-full bg-gradient-to-br from-purple-500 via-blue-500 to-teal-500 animate-pulse flex items-center justify-center z-10">
          <div class="absolute w-20 h-20 rounded-full border border-white/20 animate-ping-slow opacity-70"></div>
          <div class="absolute w-24 h-24 rounded-full border border-white/10 animate-ping-slow opacity-50" style="animation-delay: 0.5s;"></div>
          <div class="w-8 h-8 rounded-full bg-white/80 backdrop-blur-md"></div>
        </div>

        <!-- 384px (w-96 h-96) Orbital Ring -->
        <div class="absolute w-96 h-96 rounded-full border border-white/10 pointer-events-none"></div>

        <!-- Nodes mounted dynamically by script -->
        <div id="nodes-mount" class="contents"></div>
      </div>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
