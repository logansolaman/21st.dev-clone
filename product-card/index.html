<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Highlight Card - 1:1 Clone</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen flex items-center justify-center p-4 font-sans select-none">
  
  <!-- 1:1 Product Highlight Card by @ravikatiyar162 -->
  <div class="relative w-full max-w-sm rounded-3xl bg-neutral-950 border border-neutral-800 p-6 shadow-2xl flex flex-col justify-between overflow-hidden group">
    
    <!-- Top Row: Badge & Rating -->
    <div class="flex items-center justify-between z-10">
      <span class="px-2.5 py-1 rounded-full text-[10px] font-mono font-bold uppercase bg-white/10 text-white tracking-wider">NEW ARRIVAL</span>
      <span class="text-xs text-neutral-400 flex items-center gap-1 font-mono">
        <span class="text-amber-400">★</span> 4.9 (128)
      </span>
    </div>

    <!-- Product Image Stage with Hover Scale -->
    <div class="relative w-full h-56 flex items-center justify-center my-4 overflow-hidden">
      <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(255,255,255,0.06)_0,transparent_70%)] pointer-events-none"></div>
      <img alt="White USB-C cable" src="https://lftz25oez4aqbxpq.public.blob.vercel-storage.com/image-b3aKXmNboBC5A2lhRgyEeUYJMuII0v.png" class="max-h-48 object-contain transition-transform duration-500 group-hover:scale-110 drop-shadow-2xl z-10" />
    </div>

    <!-- Bottom Info & CTA Button -->
    <div class="flex flex-col gap-4 z-10">
      <div>
        <h3 class="text-lg font-bold text-white leading-tight">Thunderbolt 4 Pro Cable</h3>
        <p class="text-xs text-neutral-400 mt-1">Braided silicone wire with 240W Power Delivery & 40Gbps data throughput.</p>
      </div>

      <div class="flex items-center justify-between pt-3 border-t border-neutral-800">
        <div>
          <span class="text-xs text-neutral-500 block">Retail Price</span>
          <span class="text-xl font-bold font-mono text-white">$29.00</span>
        </div>
        <button id="add-to-cart-btn" class="px-5 py-2.5 rounded-xl bg-white hover:bg-neutral-200 text-black text-xs font-bold transition-all active:scale-95 shadow-md cursor-pointer">
          Add to Cart
        </button>
      </div>
    </div>

  </div>

  <script>
    document.getElementById("add-to-cart-btn").addEventListener("click", () => {
      alert("Thunderbolt 4 Pro Cable added to your bag!");
    });
  </script>
</body>
</html>
